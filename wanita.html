
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Undangan WhatsApp</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #252525;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,.06);
        }

        h2 {
            margin-top: 0;
            font-size: 23px;
        }

        .description {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 18px 0 8px;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #16845b;
        }

        textarea {
            min-height: 400px;
            resize: vertical;
            line-height: 1.6;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            margin-top: 12px;
        }

        .copy-btn {
            background: #16845b;
            color: white;
        }

        .copy-btn:hover {
            background: #106d49;
        }

        .reset-btn {
            background: #eeeeee;
            color: #333;
        }

        .info {
            font-size: 12px;
            color: #777;
            margin-top: 8px;
        }

        #status {
            text-align: center;
            font-size: 13px;
            margin-top: 12px;
            color: #16845b;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Generator Undangan WhatsApp</h2>

    <p class="description">
        Masukkan nama penerima undangan. Sistem akan
        otomatis membuat teks undangan beserta link
        personal yang siap disalin ke WhatsApp.
    </p>

    <label>Nama Penerima Undangan</label>

    <input
        type="text"
        id="nama"
        placeholder="Contoh: Bapak Andi dan Keluarga"
        value="Melan dan Pasangan"
        oninput="generate()"
    >

    <label>Hasil Undangan WhatsApp</label>

    <textarea id="hasil" readonly></textarea>

    <button class="copy-btn" onclick="copyInvitation()">
        Salin Undangan
    </button>

    <button class="reset-btn" onclick="resetForm()">
        Reset Nama
    </button>

    <div id="status"></div>

</div>

<script>

function generate() {

    const nama = document.getElementById("nama").value.trim();

    const encodedName = encodeURIComponent(nama)
        .replace(/%20/g, "+");

    const link =
        "https://invitystudio.ct.ws/pawiwahan-desak_dan_dewa/?to="
        + encodedName;

    const teks = `*Om Swastyastu*

*UNDANGAN PAWIWAHAN*
_Desak Kayan Witriani & Dewa Nyoman Murdiana_

Kepada Yth.
*${nama || "[Nama Penerima]"}*

Atas asung kertha wara nugraha Ida Sang Hyang Widhi Wasa, dengan penuh kebahagiaan dan rasa syukur, kami bermaksud mengundang Bapak/Ibu/Saudara/i untuk menghadiri upacara Pawiwahan kami:

*Desak Kayan Witriani*
Putri dari Bapak Dewa Made Abasan
dan Ibu Desak Made Jawe

_dengan_

*Dewa Nyoman Murdiana*
Putra dari Bapak Dewa Ketut Wijana
dan Ibu Desak Ketut Murni

*WAKTU DAN TEMPAT ACARA*

*Selasa, 10 November 2026*
Pukul 07.00–15.50 WITA

Tempat:
Kediaman Mempelai Wanita
Desa Rahanggada, Jln. Kelapi, dekat Lapangan Sepak Bola, Kecamatan Tanggetada.

*Rabu, 11 November 2026*
Pukul 07.00 WITA – selesai

Tempat:
Kediaman Mempelai Pria
Desa Wunggoloko, Kelurahan Atula, Kecamatan Ladonggi.

*UNDANGAN DIGITAL*

Untuk informasi selengkapnya mengenai acara, silakan membuka tautan undangan berikut:

${link}

Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir serta memberikan doa restu untuk mengiringi langkah kami dalam membangun kehidupan rumah tangga.

Undangan digital ini merupakan undangan resmi dari kami. Mengingat keterbatasan jarak dan waktu, dengan segala kerendahan hati, kami menyampaikan undangan ini melalui media online tanpa mengurangi rasa hormat dan penghargaan kami kepada Bapak/Ibu/Saudara/i.

Kami yang berbahagia,

*Desak & Dewa*
Beserta keluarga besar

*Om Shanti, Shanti, Shanti Om*`;

    document.getElementById("hasil").value = teks;
}

async function copyInvitation() {

    const hasil = document.getElementById("hasil");

    try {
        await navigator.clipboard.writeText(hasil.value);
    } catch (error) {
        hasil.select();
        document.execCommand("copy");
    }

    document.getElementById("status").textContent =
        "Undangan berhasil disalin. Silakan tempel di WhatsApp.";
}

function resetForm() {

    document.getElementById("nama").value = "";

    generate();

    document.getElementById("status").textContent = "";
}

// Generate otomatis saat halaman dibuka
generate();

</script>

</body>
</html>
